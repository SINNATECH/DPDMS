server:
  port: 8085

spring:
  application:
    name: mining-accident-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mining_accident_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update      # use Flyway/Liquibase migrations before you submit
    show-sql: false
    properties:
      hibernate:
        format_sql: true

dpdms:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-real-32-plus-character-secret}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html
