server:
  port: 8086

spring:
  application:
    name: auth-service

dpdms:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-real-32-plus-character-secret}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html
