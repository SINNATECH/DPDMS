server:
  port: 8090

spring:
  application:
    name: web-client
  thymeleaf:
    cache: false   # so template edits show up on refresh without a restart during development

dpdms:
  gateway:
    base-url: ${GATEWAY_URL:http://localhost:8080}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
